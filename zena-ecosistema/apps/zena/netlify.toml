# Netlify — zenaayoub.com
# En Netlify: Base directory = zena-ecosistema/apps/zena (rutas de este archivo relativas a esa carpeta)
[build]
  command = "cd ../.. && npm ci && npm run build:zena"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
