<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">Cascada El Tambo, Tena</title>
  <desc id="d">Ilustración de una cascada de unos 40 metros que cae entre montañas verdes y vegetación andina, con un sendero y árboles frutales.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3E7CC"/><stop offset="1" stop-color="#EAF0E2"/></linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6F2F6"/><stop offset=".6" stop-color="#BFDCE7"/><stop offset="1" stop-color="#F7FBFC"/></linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FA3B8"/><stop offset="1" stop-color="#2D5E78"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6C86A"/><stop offset="1" stop-color="#F6C86A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="620" cy="110" r="120" fill="url(#sun)" opacity=".55"/>
  <circle cx="620" cy="110" r="38" fill="#F2BE5C"/>
  <!-- montañas lejanas -->
  <path d="M0 260 L120 170 L210 220 L330 120 L450 210 L560 150 L680 230 L800 180 L800 600 L0 600Z" fill="#B9CBB0"/>
  <path d="M0 300 L90 240 L200 290 L300 220 L420 300 L520 250 L650 310 L800 260 L800 600 L0 600Z" fill="#8FAE84"/>
  <!-- acantilado y cascada -->
  <path d="M250 600 L250 250 Q270 205 330 200 L470 200 Q530 205 550 250 L550 600Z" fill="#5F6B4E"/>
  <path d="M265 600 L268 262 Q285 225 330 222 L360 222 L360 600Z" fill="#4A5640"/>
  <path d="M440 222 L470 222 Q515 226 532 262 L535 600 L440 600Z" fill="#4A5640"/>
  <!-- vegetación del borde superior -->
  <g fill="#3F6B3A">
    <circle cx="270" cy="215" r="34"/><circle cx="310" cy="196" r="30"/><circle cx="350" cy="205" r="24"/>
    <circle cx="455" cy="205" r="24"/><circle cx="495" cy="194" r="32"/><circle cx="535" cy="214" r="34"/>
  </g>
  <!-- caída de agua -->
  <path d="M362 205 Q400 200 438 205 L446 520 Q400 532 354 520Z" fill="url(#fall)"/>
  <g stroke="#9CC6D6" stroke-width="3" stroke-linecap="round" opacity=".8">
    <path d="M372 215 L368 500"/><path d="M386 212 L384 515"/><path d="M402 210 L403 518"/><path d="M418 212 L420 512"/><path d="M432 216 L436 498"/>
  </g>
  <!-- poza y bruma -->
  <ellipse cx="400" cy="548" rx="200" ry="40" fill="url(#pool)"/>
  <g fill="#FFFFFF" opacity=".85">
    <ellipse cx="400" cy="522" rx="80" ry="20"/><ellipse cx="350" cy="530" rx="44" ry="14"/><ellipse cx="455" cy="530" rx="46" ry="14"/>
  </g>
  <!-- bosque en primer plano -->
  <path d="M0 600 L0 430 Q60 390 120 420 Q170 380 230 430 L250 600Z" fill="#2F5A33"/>
  <path d="M800 600 L800 420 Q740 380 680 410 Q630 370 570 425 L550 600Z" fill="#2F5A33"/>
  <g fill="#244A2B">
    <path d="M60 600 L60 470 Q40 440 70 420 Q100 440 82 470 L82 600Z"/>
    <path d="M720 600 L720 460 Q700 430 732 412 Q762 432 744 460 L744 600Z"/>
  </g>
  <!-- árboles frutales -->
  <g>
    <circle cx="150" cy="455" r="46" fill="#4E7F3F"/><rect x="144" y="490" width="12" height="70" fill="#6B4E32"/>
    <g fill="#E58B3A"><circle cx="128" cy="440" r="6"/><circle cx="160" cy="432" r="6"/><circle cx="172" cy="462" r="6"/><circle cx="138" cy="470" r="6"/></g>
    <circle cx="650" cy="450" r="44" fill="#4E7F3F"/><rect x="644" y="485" width="12" height="75" fill="#6B4E32"/>
    <g fill="#F2C14E"><circle cx="630" cy="438" r="6"/><circle cx="664" cy="430" r="6"/><circle cx="672" cy="462" r="6"/><circle cx="640" cy="466" r="6"/></g>
  </g>
  <!-- sendero -->
  <path d="M190 600 Q240 560 300 572 Q340 580 360 566" fill="none" stroke="#D9C49C" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 22"/>
  <!-- aves -->
  <g fill="none" stroke="#2D3B2E" stroke-width="3" stroke-linecap="round">
    <path d="M160 140 q10 -10 20 0 q10 -10 20 0"/><path d="M215 115 q8 -8 16 0 q8 -8 16 0"/>
  </g>
  <!-- etiqueta de altura -->
  <g font-family="Georgia, serif" font-size="18" fill="#1D3A2B">
    <path d="M585 205 L585 520" stroke="#1D3A2B" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M578 205 L592 205 M578 520 L592 520" stroke="#1D3A2B" stroke-width="1.5"/>
    <text x="598" y="368" font-style="italic">~40 m</text>
  </g>
</svg>
