# Netlify — The Adventurers Children Foundation (theadventurerscf.org)
# En Netlify: Base directory = zena-ecosistema/apps/fundacion (rutas de este archivo relativas a esa carpeta)
# Variables de entorno en Netlify: STRIPE_SECRET_KEY (secreta), PUBLIC_STRIPE_KEY (pk_live_…)
[build]
  command = "cd ../.. && npm ci && npm run build:fundacion"
  publish = "dist"
  # Publica de nuevo si cambia este sitio o el código compartido (shared/) o las dependencias
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../shared ../../package.json ../../package-lock.json"

[build.environment]
  NODE_VERSION = "22"
  PUBLIC_STRIPE_ENDPOINT = "/api/donacion"
  # Clave publicable de Stripe (pública por diseño). La secreta va en Netlify: STRIPE_SECRET_KEY
  PUBLIC_STRIPE_KEY = "pk_live_51TP2JWJvfAMHnIKvCuoyrD7qkyUTNXAWDlSnVJJaGZwtoCqiku5LFbK5tyuluXENvXiMyiwXX1rqDqlgQi6MUzAS00s64VitVK"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/donacion"
  to = "/.netlify/functions/donacion"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
